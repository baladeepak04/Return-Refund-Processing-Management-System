# Dev-mode: instant frontend hot-reload (Vite dev server), no rebuild for
# any React/JS change. This is a SEPARATE service (frontend-dev), not an
# override of the normal "frontend" service, so there's no ambiguity about
# which one actually runs. Bring up everything except the normal frontend:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     up -d postgres redis backend frontend-dev
#
# Then open http://localhost:8081 — same port, but now backed by Vite's dev
# server with the project source bind-mounted in. Edit any file under
# rrpms-frontend/src and the browser updates within ~1 second, no Docker
# command needed at all.
#
# The backend still needs `docker compose up --build backend` for Java
# changes (real hot-reload for Spring Boot is a bigger separate setup) — but
# the Dockerfile cache mount added alongside this file means that rebuild is
# now ~10-30s once dependencies are cached, not several minutes.
services:
  frontend-dev:
    image: node:20-alpine
    container_name: rrpms-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8081"
    environment:
      VITE_BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    volumes:
      - ./rrpms-frontend:/app
      - rrpms_frontend_node_modules:/app/node_modules
    ports:
      - "8081:8081"

volumes:
  rrpms_frontend_node_modules:
